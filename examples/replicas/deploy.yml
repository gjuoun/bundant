# yaml-language-server: $schema=../../schema/v2/deploy.schema.json
# bundant example: three copies of one service on one host.
# traefik/whoami echoes its container hostname, so a loop of 9 requests shows
# the three replicas in strict rotation:
#
#   for i in $(seq 9); do curl -s -H "Host: echoes.bundant.test" http://HOST/; done
#
# replicas > 1 needs proxy.enabled: true — the proxy is what distributes the
# requests.
version: 2
service: echoes
image: traefik/whoami:v1.10
role: web
replicas: 3
hosts:
  - replace-me.example.ts.net
healthcheck:
  path: /
  timeout: 30
proxy:
  enabled: true
  host: echoes.bundant.test
  port: 80
  tls: false
