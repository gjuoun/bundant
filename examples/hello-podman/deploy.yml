# yaml-language-server: $schema=../../schema/deploy.schema.json
# bundant example: the same zero-downtime hello service on a rootless podman host.
# Requires net.ipv4.ip_unprivileged_port_start <= 80 for the proxy to bind 80/443
# (the plan's port-guard step checks this and aborts with the fix).
version: 2
service: hello
image: traefik/whoami:v1.10
role: web
runtime: podman
hosts:
  - replace-me.example.ts.net
healthcheck:
  path: /
  timeout: 30
proxy:
  enabled: true
  host: hello-podman.bundant.test
  port: 80
  tls: false
