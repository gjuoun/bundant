# yaml-language-server: $schema=../../../schema/v2/deploy.schema.json
# Last member in the group: needs api to pass its health gate first.
version: 2
service: web
image: traefik/whoami:v1.10
hosts:
  - replace-me.example.ts.net
env:
  vars:
    API_URL: http://api.shop.example.com
healthcheck:
  path: /
  timeout: 30
proxy:
  enabled: true
  host: shop.example.com
  port: 80
  tls: false
