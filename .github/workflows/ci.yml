name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run src/cli.ts --version
      - run: bun run src/cli.ts deploy --dry-run -f examples/hello/deploy.yml > /dev/null
      - run: bun run src/cli.ts delete --dry-run -f examples/hello/deploy.yml > /dev/null

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # bun only installs node_modules here; the CLI itself runs under node.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: node --version
      - run: node src/cli.ts --help
      - run: node src/cli.ts --version
      - run: node src/cli.ts deploy --dry-run -f examples/hello/deploy.yml > /dev/null
      - run: node src/cli.ts delete --dry-run -f examples/hello/deploy.yml > /dev/null
      # installed-bin smoke: a broken shebang or missing files entry cannot ship
      - run: bun run build
      - run: npm pack --pack-destination /tmp
      - run: npm i -g --prefix /tmp/npmtest /tmp/bundant-0.1.0.tgz
      - run: /tmp/npmtest/bin/bundant --version
      - run: /tmp/npmtest/bin/bundant --help > /dev/null
