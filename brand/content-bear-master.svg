<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">bundant content bear mark</title>
  <desc id="desc">A contented bear leaning into the frame from the lower right: the back of its head and its neck run out of the canvas. Bigface is the polar bear; this is the warmer cousin that ships software.</desc>
  <defs>
    <linearGradient id="fur" gradientUnits="userSpaceOnUse" x1="-180" y1="-200" x2="200" y2="240">
      <stop offset="0" stop-color="#FF9800"/>
      <stop offset="1" stop-color="#FC5D23"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#252925"/>

  <!-- Everything below is drawn in face-local coordinates (origin = head centre),
       then placed once: the head leans in from the lower right, so the back of the
       skull and the neck leave the frame on those two edges. -->
  <g transform="translate(398 322) rotate(-9)">
    <!-- Ears on the crown: far one behind, near one larger -->
    <circle cx="-96" cy="-186" r="54" fill="url(#fur)"/>
    <circle cx="-96" cy="-186" r="26" fill="#FC5D23" fill-opacity="0.7"/>
    <circle cx="68" cy="-196" r="62" fill="url(#fur)"/>
    <circle cx="68" cy="-196" r="30" fill="#FC5D23" fill-opacity="0.7"/>

    <!-- Head -->
    <ellipse cx="0" cy="0" rx="206" ry="200" fill="url(#fur)"/>

    <!-- Snout, pushed out to the left so it breaks the head outline -->
    <ellipse cx="-150" cy="58" rx="118" ry="90" fill="#D9D9D4"/>

    <!-- Nose at the tip of the snout -->
    <rect x="-246" y="22" width="58" height="44" rx="21" fill="#1F231F" transform="rotate(-8 -217 44)"/>

    <!-- One contented smile, under the nose and running back along the muzzle -->
    <path d="M -214 94 C -198 126, -152 132, -116 110" fill="none" stroke="#1F231F" stroke-width="12" stroke-linecap="round"/>

    <!-- Closed, satisfied eyes: the far eye smaller, because the head is turned -->
    <g fill="none" stroke="#1F231F" stroke-linecap="round">
      <path d="M -8 -84 C 6 -104, 40 -104, 54 -84" stroke-width="18"/>
      <path d="M -128 -74 C -116 -90, -86 -90, -74 -74" stroke-width="15"/>
    </g>
  </g>
</svg>
